services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: data/tasks.db
      PDF_OUTPUT_DIR: data/pdf
      DIRECT_STORAGE_STATE: data/storage_state.json
    volumes:
      - app_data:/app/data
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: data/tasks.db
      PDF_OUTPUT_DIR: data/pdf
      DIRECT_STORAGE_STATE: data/storage_state.json
      PLAYWRIGHT_HEADLESS: "true"
    command: ["python", "-m", "arq", "app.worker.arq_app.WorkerSettings"]
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/frontend-dist:/srv/frontend/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  redis_data:
  caddy_data:
  caddy_config:
